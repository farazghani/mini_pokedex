<mat-drawer-container class="drawer-container">

  <mat-drawer-content>

    <div class="container">

      <div class="card">

        <header class="toolbar">

          <app-search-bar
            (searchChanged)="onSearch($event)">
          </app-search-bar>

          <app-type-filter
            [types]="pokemonTypes()"
            (selected)="onTypeChanged($event)">
          </app-type-filter>

        </header>

        <app-pokemon-table
          [pokemon]="pokemon()"
          [loading]="loading()"
          [error]="error()"
          (rowClicked)="onPokemonClick($event)"
          (sortChanged)="onSort($event)"
          (pageChanged)="onPage($event)">
        </app-pokemon-table>

      </div>

    </div>

  </mat-drawer-content>

  <mat-drawer
    mode="side"
    position="end"
    [opened]="drawerOpen()"
    class="detail-drawer">

    <app-pokemon-detail
      [pokemon]="selectedPokemon()"
      (closed)="closeDrawer()">
    </app-pokemon-detail>

  </mat-drawer>

</mat-drawer-container>
