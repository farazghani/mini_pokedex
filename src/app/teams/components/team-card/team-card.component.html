<article
  class="team-card"
  [class.is-selected]="selected()"
  (click)="onSelect()">

  <div class="header">

    <div>

      <h3>{{ team().name }}</h3>

      <small>Created {{ team().createdAt | date }}</small>

    </div>

    <button
      mat-stroked-button
      type="button"
      (click)="$event.stopPropagation(); onDelete()">

      Delete

    </button>

  </div>

  <app-async-state
    [loading]="pokemonLoading()"
    [error]="pokemonError()"
    [empty]="!pokemonLoading() && !pokemonError() && teamPokemon().length === 0"
    loadingTitle="Loading Pokémon"
    loadingMessage="Resolving team members from the Pokémon cache."
    emptyTitle="No Pokémon assigned"
    emptyMessage="This team has no Pokémon yet."
    errorTitle="Pokémon unavailable"
    errorMessage="We could not load Pokémon details for this team."
    retryLabel="Retry"
    (retry)="retryPokemonLoad()">

    <div class="pokemon-grid">

      @for (pokemon of teamPokemon(); track pokemon.id) {

        <div class="pokemon">

          <img
            [src]="pokemon.sprite"
            [alt]="pokemon.name">

          <span>{{ pokemon.name }}</span>

        </div>

      }

    </div>

  </app-async-state>

</article>
