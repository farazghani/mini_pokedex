<h2 mat-dialog-title>
    Create Team
</h2>

<mat-dialog-content>
    <form
        [formGroup]="form">
        <mat-form-field
            appearance="outline"
            class="full-width">
            <mat-label>
                Team Name
            </mat-label>

            <input
                matInput
                formControlName="name"
                placeholder="Elite Four">

            @if(form.controls.name.hasError('required')){

            <mat-error>
                Team name is required.
            </mat-error>

            }

            @if(form.controls.name.hasError('minlength')){
            <mat-error>
                Minimum 3 characters.
            </mat-error>
            }
        </mat-form-field>
    </form>

</mat-dialog-content>
<mat-dialog-actions align="end">
    <button
        mat-button
        (click)="cancel()">
        Cancel
    </button>

    <button
        mat-raised-button
        color="primary"
        (click)="create()">
        Create
    </button>

</mat-dialog-actions>
