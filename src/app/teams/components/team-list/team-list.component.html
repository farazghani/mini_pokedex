<div class="header">

  <h2>Teams</h2>

  <button
    mat-raised-button
    color="primary"
    (click)="createClicked.emit()">

    + New Team

  </button>

</div>

@if (teams().length === 0) {

  <p>No Teams Yet</p>

} @else {

  <div class="team-grid">

    @for (team of teams(); track team.id) {

      <app-team-card

        [team]="team"

        (delete)="teamDeleted.emit($event)">

      </app-team-card>

    }

  </div>

}
