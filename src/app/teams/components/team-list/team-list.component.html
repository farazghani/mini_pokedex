<div class="header">

  <h2>Teams</h2>

  <button
    mat-raised-button
    color="primary"
    type="button"
    (click)="createClicked.emit()">

    + New Team

  </button>

</div>

<app-async-state
  [loading]="loading()"
  [error]="error()"
  [empty]="teams().length === 0"
  loadingTitle="Loading teams"
  loadingMessage="Fetching saved teams."
  emptyTitle="No teams yet"
  [emptyMessage]="emptyMessage()"
  errorTitle="Teams unavailable"
  errorMessage="We could not load your teams right now."
  retryLabel="Retry"
  (retry)="retry.emit()">

  <div class="team-grid">

    @for (team of teams(); track team.id) {

      <app-team-card
        [team]="team"
        [selected]="team.id === selectedTeamId()"
        (teamSelected)="teamSelected.emit($event)"
        (delete)="teamDeleted.emit($event)">

      </app-team-card>

    }

  </div>

</app-async-state>
