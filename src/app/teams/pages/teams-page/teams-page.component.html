<div class="header">

    <h1>

        My Teams

    </h1>

    <a routerLink="/teams/create">

        Create Team

    </a>

</div>

@if(teams$ | async; as teams){

    @if(teams.length===0){

        <p>

            No Teams Yet

        </p>

    }

    @else{

        <div class="team-grid">

            @for(
                team of teams;
                track team.id
            ){

                <app-team-card

                    [team]="team"

                    (delete)="deleteTeam($event)">

                </app-team-card>

            }

        </div>

    }

}
